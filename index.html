<style>
/* Bảng màu theo mục 3.12. Không viết mã màu nào ngoài các biến dưới đây. */
:root {
  --chinh: #0F766E; --chinh-dam: #134E4A; --nhat: #F0FDFA; --nhat-2: #CCFBF1;
  --vang: #F59E0B; --vang-2: #FBBF24; --kem: #FFFBEB; --kem-2: #FEF3C7;
  --muc: #0F172A; --phu: #475569; --vien: #E2E8F0; --nen: #F8FAFC; --trang: #FFFFFF;
  --tot-c: #166534; --tot-n: #DCFCE7; --kha-c: #1E40AF; --kha-n: #DBEAFE; --dat-c: #92400E; --dat-n: #FEF3C7;
  --cd-c: #991B1B; --cd-n: #FEE2E2; --tl-c: #9A3412; --tl-n: #FFEDD5; --cg-c: #334155; --cg-n: #F1F5F9;
  --to1: #2563EB; --to2: #7C3AED; --to3: #BE185D; --to4: #B45309;
  --toi: #0B3B37; --vang-sang: #FDE68A;
  --bong: 0 1px 2px rgba(15, 23, 42, .06), 0 4px 12px rgba(15, 23, 42, .06);
  --bong-noi: 0 2px 6px rgba(15, 23, 42, .08), 0 16px 32px rgba(15, 23, 42, .12);
  --bo: 14px; --bo-nut: 10px;
  --chu: "Be Vietnam Pro", "Noto Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --don-cach: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  --nhanh: 180ms;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; font-family: var(--chu); font-size: 16px; line-height: 1.5; color: var(--muc); background: var(--nen); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--chinh); outline-offset: 2px; }
h1, h2, h3, p { margin: 0; }
.so { font-variant-numeric: tabular-nums; }
.ma-muc { font-family: var(--don-cach); font-size: 13px; font-weight: 600; color: var(--cg-c); background: var(--cg-n); border-radius: 6px; padding: 2px 6px; white-space: nowrap; }
.an { display: none !important; }
.chu-phu { color: var(--phu); font-size: 14px; }
.nhan { font-size: 13px; color: var(--phu); font-weight: 600; letter-spacing: .01em; }
.cat-dong { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.hai-dong { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.bieu-tuong.nho { width: 16px; height: 16px; vertical-align: -3px; }
.bieu-tuong { width: 20px; height: 20px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }

/* ----- nút ----- */
.nut { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 20px; border-radius: var(--bo-nut);
  border: 1px solid var(--vien); background: var(--trang); color: var(--muc); font-weight: 600; font-size: 16px; text-decoration: none;
  transition: background var(--nhanh), border-color var(--nhanh), transform var(--nhanh), box-shadow var(--nhanh); white-space: nowrap; }
.nut:hover { border-color: var(--phu); }
.nut:active { transform: translateY(1px); }
.nut[disabled] { opacity: .55; cursor: not-allowed; }
.nut-chinh { background: var(--chinh); border-color: var(--chinh); color: var(--trang); box-shadow: 0 1px 2px rgba(15, 118, 110, .25); }
.nut-chinh:hover { background: var(--chinh-dam); border-color: var(--chinh-dam); }
.nut-tra { border-color: var(--tl-c); color: var(--tl-c); }

.nut-nho { min-height: 44px; padding: 0 14px; font-size: 15px; }
.nut-rong { width: 100%; }
.nut-chu { min-height: 44px; border: 0; background: transparent; color: var(--chinh); padding: 0 8px; font-weight: 600; }
.nut-chu:hover { background: var(--nhat); }
.nut-tron { width: 44px; height: 44px; min-height: 44px; padding: 0; border-radius: 50%; }

/* ----- thẻ ----- */
.the { background: var(--trang); border: 1px solid var(--vien); border-radius: var(--bo); box-shadow: var(--bong); padding: 16px; }
.the + .the { margin-top: 16px; }
.the-dau { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
.the-dau h2 { font-size: 18px; font-weight: 700; line-height: 1.3; flex: 1; min-width: 0; }
.the-dau .bieu-tuong { color: var(--chinh); }
.o-bieu-tuong { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--nhat); color: var(--chinh); flex: none; }
.o-bieu-tuong .bieu-tuong { width: 22px; height: 22px; }
.the-vinh-danh { background: var(--kem); border-color: var(--kem-2); border-left: 4px solid var(--vang); }
.the-vinh-danh .o-bieu-tuong { background: var(--kem-2); color: var(--dat-c); }

/* ----- viên trạng thái ----- */
.vien-thuoc { display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; padding: 2px 10px 2px 8px; font-size: 13px; font-weight: 600; white-space: nowrap; line-height: 20px; }
.vien-thuoc .bieu-tuong { width: 14px; height: 14px; stroke-width: 2.2; }
.vt-tot { color: var(--tot-c); background: var(--tot-n); } .vt-kha { color: var(--kha-c); background: var(--kha-n); }
.vt-dat { color: var(--dat-c); background: var(--dat-n); } .vt-cd { color: var(--cd-c); background: var(--cd-n); }
.vt-tl { color: var(--tl-c); background: var(--tl-n); } .vt-cg { color: var(--cg-c); background: var(--cg-n); }
.vt-chot { color: var(--chinh-dam); background: var(--nhat-2); }

.to-1 { background: var(--to1); } .to-2 { background: var(--to2); } .to-3 { background: var(--to3); } .to-4 { background: var(--to4); } .to-0 { background: var(--phu); }

/* ----- khung trang ----- */
#ung-dung { min-height: 100vh; }

@media (max-width: 479px) { .chip-tuan .ngay-chip { display: none; } }

.dai-hoa-van { display: block; width: 100%; height: 8px; }
.than { display: flex; max-width: 1280px; margin: 0 auto; }
main { flex: 1; min-width: 0; padding: 16px 16px 104px; max-width: 1040px; margin: 0 auto; width: 100%; }
.tieu-de-man { display: flex; align-items: flex-end; gap: 12px; margin: 4px 0 16px; flex-wrap: wrap; }
.tieu-de-man h2 { font-size: 22px; font-weight: 700; line-height: 1.25; flex: 1; min-width: 200px; }
.thanh-duoi { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: var(--trang); border-top: 1px solid var(--vien); display: flex;
  padding-bottom: env(safe-area-inset-bottom); box-shadow: 0 -4px 16px rgba(15, 23, 42, .05); }
.muc-dieu-huong { flex: 1; min-width: 0; min-height: 60px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border: 0;
  background: transparent; color: var(--phu); font-size: 12px; font-weight: 600; position: relative; padding: 4px 2px; }
.muc-dieu-huong .bieu-tuong { width: 24px; height: 24px; }
.muc-dieu-huong[aria-current="page"] { color: var(--chinh); }
.muc-dieu-huong[aria-current="page"]::before { content: ""; position: absolute; top: 0; left: 25%; right: 25%; height: 3px; border-radius: 0 0 3px 3px; background: var(--chinh); }
.muc-dieu-huong .cham { position: absolute; top: 6px; left: calc(50% + 8px); min-width: 18px; height: 18px; border-radius: 9px; background: var(--vang); color: var(--muc); font-size: 11px; display: grid; place-items: center; padding: 0 4px; }
.cot-trai { display: none; }
@media (min-width: 900px) {
  .thanh-duoi { display: none; }
  .cot-trai { display: block; width: 240px; flex: none; padding: 16px 12px; position: sticky; top: 64px; align-self: flex-start; }
  .cot-trai .muc-dieu-huong { flex-direction: row; justify-content: flex-start; gap: 12px; font-size: 15px; min-height: 48px; padding: 0 12px; border-radius: var(--bo-nut); width: 100%; }
  .cot-trai .muc-dieu-huong[aria-current="page"] { background: var(--nhat-2); color: var(--chinh-dam); }
  .cot-trai .muc-dieu-huong[aria-current="page"]::before { display: none; }
  .cot-trai .muc-dieu-huong .cham { position: static; margin-left: auto; }
  .cot-trai hr { border: 0; border-top: 1px solid var(--vien); margin: 12px 4px; }
  main { padding: 24px 24px 48px; }
  .luoi-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
  .luoi-2 > .the + .the, .luoi-2 > .cot > .the + .the { margin-top: 0; }
  .luoi-2 > .cot { display: grid; gap: 16px; }
  .luoi-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
}

/* ----- ô nhập ----- */
.o-nhap { width: 100%; min-height: 48px; border: 1px solid var(--vien); border-radius: var(--bo-nut); padding: 10px 14px; background: var(--trang); font-size: 16px; }
.o-nhap:focus { border-color: var(--chinh); outline: 2px solid var(--nhat-2); outline-offset: 0; }

.nhan-o { display: block; font-size: 14px; font-weight: 600; margin: 0 0 6px; }
.truong + .truong { margin-top: 16px; }
.dem-ky-tu { text-align: right; font-size: 12px; color: var(--phu); margin-top: 4px; }

/* ----- đăng nhập ----- */
.man-dang-nhap { min-height: 100vh; background: var(--nhat); display: flex; flex-direction: column; align-items: center; padding: 40px 16px 32px; position: relative; overflow: hidden; }
.man-dang-nhap::before { content: ""; position: absolute; inset: auto -20% -38% -20%; height: 60%; background: var(--nhat-2); border-radius: 50% 50% 0 0; opacity: .6; }
.dn-dau { text-align: center; position: relative; z-index: 1; }

.dn-dau h1 { font-size: 30px; font-weight: 700; color: var(--chinh-dam); margin-top: 12px; letter-spacing: -.01em; }
.dn-dau p { color: var(--phu); margin-top: 4px; }
.dn-dai { width: 168px; height: 8px; margin: 16px auto 0; border-radius: 4px; overflow: hidden; }
.dn-the { position: relative; z-index: 1; width: 100%; max-width: 400px; margin-top: 28px; background: var(--trang); border-radius: 20px; box-shadow: var(--bong-noi); padding: 24px 16px; border: 1px solid var(--vien); }

.o-pin { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }

.o-pin input { width: 100%; height: 52px; text-align: center; font-size: 22px; font-weight: 700; border: 1px solid var(--vien); border-radius: var(--bo-nut); background: var(--nen); font-family: var(--don-cach); }
.o-pin input:focus { border-color: var(--chinh); background: var(--trang); outline: 2px solid var(--nhat-2); outline-offset: 0; }
.dn-chan { position: relative; z-index: 1; margin-top: 20px; text-align: center; color: var(--phu); font-size: 14px; display: flex; align-items: center; gap: 6px; }
.thanh-loi { display: flex; gap: 8px; align-items: flex-start; background: var(--cd-n); color: var(--cd-c); border-radius: var(--bo-nut); padding: 10px 12px; font-size: 14px; font-weight: 600; margin-top: 12px; }
.thanh-loi .bieu-tuong { width: 18px; height: 18px; margin-top: 1px; }

/* ----- khung xám chờ ----- */
.khung-cho { background: linear-gradient(90deg, var(--cg-n) 0%, var(--nen) 50%, var(--cg-n) 100%); background-size: 200% 100%; animation: anh-cho 1.2s linear infinite; border-radius: 8px; }
@keyframes anh-cho { from { background-position: 200% 0; } to { background-position: -200% 0; } }

/* ----- danh sách ----- */
.ds { list-style: none; margin: 0; padding: 0; }
.dong-ds { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--vien); min-height: 56px; }
.dong-ds:first-child { border-top: 0; }
.dong-bam { width: 100%; text-align: left; background: transparent; border: 0; border-top: 1px solid var(--vien); padding: 12px 4px; display: flex; align-items: center; gap: 12px; min-height: 64px; border-radius: 0; }
.dong-bam:first-child { border-top: 0; }
.dong-bam:hover { background: var(--nen); }
.dong-giua { flex: 1; min-width: 0; }
.dong-ten { font-weight: 600; }
.diem-nho { font-weight: 700; font-variant-numeric: tabular-nums; min-width: 48px; text-align: right; }

/* ----- trang chủ ----- */
.chao h2 { font-size: 24px; font-weight: 700; line-height: 1.25; }
.chao p { color: var(--phu); margin-top: 2px; }
.viec-chinh { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.han { display: inline-flex; align-items: center; gap: 6px; color: var(--phu); font-size: 14px; font-weight: 600; }
.han .bieu-tuong { width: 16px; height: 16px; }
.dong-viec { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 12px; background: var(--nen); border: 1px solid var(--vien); margin-top: 12px; width: 100%; text-align: left; min-height: 56px; }
.dong-viec:hover { border-color: var(--chinh); }
.dong-viec .so-lon { font-size: 22px; font-weight: 700; color: var(--chinh); font-variant-numeric: tabular-nums; min-width: 32px; text-align: center; }
.tab-vd { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; background: var(--kem-2); border-radius: 12px; padding: 4px; margin-bottom: 12px; }
.tab-vd button { min-height: 44px; border: 0; border-radius: 9px; background: transparent; font-weight: 600; font-size: 14px; color: var(--dat-c); padding: 0 6px; }
.tab-vd button[aria-selected="true"] { background: var(--trang); color: var(--muc); box-shadow: var(--bong); }
.khoi-vd + .khoi-vd { margin-top: 16px; padding-top: 16px; border-top: 1px dashed var(--kem-2); }

.khoi-vd h3 .bieu-tuong { width: 18px; height: 18px; }
.ba-em { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }

.chip { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 6px 12px; background: var(--trang); border: 1px solid var(--vien); font-size: 14px; font-weight: 600; max-width: 100%; }

.cac-chip { display: flex; flex-wrap: wrap; gap: 8px; }

.sn-hom-nay { display: flex; align-items: center; gap: 12px; background: var(--kem); border: 1px solid var(--kem-2); border-radius: 12px; padding: 12px; margin-bottom: 12px; font-weight: 600; }

.rong svg { width: 88px; height: 88px; display: block; margin: 0 auto 8px; }

/* ----- phiếu ----- */
.buoc { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 16px; }

.muc-loi { padding: 12px 14px; border-top: 1px solid var(--vien); transition: background var(--nhanh); }
.muc-loi:first-child { border-top: 0; }
.muc-loi[data-chon="1"] { background: var(--nhat); }

/* ----- tấm trượt, hộp hỏi ----- */

.thong-bao-nho { position: fixed; left: 50%; bottom: 88px; transform: translateX(-50%); z-index: 60; background: var(--muc); color: var(--trang); padding: 12px 18px; border-radius: 12px; font-weight: 600; font-size: 15px; box-shadow: var(--bong-noi); animation: truot-len 200ms ease-out; max-width: calc(100% - 32px); display: flex; gap: 8px; align-items: center; }
.thanh-mang { position: sticky; top: 64px; z-index: 18; display: flex; align-items: center; gap: 10px; background: var(--cd-n); color: var(--cd-c); border: 1px solid var(--cd-n); border-radius: 12px; padding: 8px 8px 8px 14px; margin-bottom: 16px; font-weight: 600; font-size: 14px; }

/* ----- bảng tuần ----- */
.o-dem { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-bottom: 16px; }

.co-canh { display: inline-flex; gap: 4px; }

.dong-phong { display: grid; grid-template-columns: 1fr 96px auto; gap: 8px; align-items: center; padding: 8px 0; border-top: 1px solid var(--vien); }

/* ----- sổ tay HIỆN TẠI ----- */

/* ----- lớp mình, thông báo, quy chế ----- */

.the-to { border-left: 4px solid var(--phu); }

.tim { position: sticky; top: 64px; z-index: 10; background: var(--nen); padding: 0 0 12px; }

/* ----- phiếu PIN in ----- */
.trang-in { display: grid; grid-template-columns: 1fr 1fr; gap: 0; background: var(--trang); }

}

/* ----- bảng chiếu ----- */

.buc { flex: 1; display: grid; grid-template-columns: 1fr 1.1fr 1fr; align-items: end; gap: 2vw; padding: 0 6vw; margin-top: 1vw; }
.bac { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; }

.bac .mot { text-align: center; display: flex; flex-direction: column; align-items: center; }

.bac .khoi { width: 100%; border-radius: 1vw 1vw 0 0; display: grid; place-items: center; font-size: max(4vw, 28px); font-weight: 700; color: var(--trang); }

.chieu-to { flex: 1; display: grid; grid-template-columns: 1fr 1.3fr; gap: 4vw; align-items: center; padding: 1vw 4vw 0; }
.cup-lon { text-align: center; }
.cup-lon svg { width: 16vw; height: 16vw; color: var(--vang); }
.cup-lon .ten { font-size: max(5vw, 32px); font-weight: 700; line-height: 1.1; }
.cup-lon .phu { font-size: max(2vw, 16px); color: var(--phu); margin-top: .6vw; }

.cot-to { display: grid; grid-template-columns: repeat(4, 1fr); gap: 2vw; align-items: end; height: 26vw; border-bottom: .3vw solid var(--vien); }
.cot-to .c { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; }
.cot-to .gia-tri { font-size: max(2.6vw, 18px); font-weight: 700; font-variant-numeric: tabular-nums; margin-bottom: .6vw; }
